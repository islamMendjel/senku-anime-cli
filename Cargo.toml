[package]
name = "senku-anime-cli"
version = "1.8.0"
edition = "2021"
authors = ["Senku"]
license = "GPL-3.0-only"
default-run = "senku-anime-cli"
description = "Lightning-fast, zero-bloat Arabic-subbed anime CLI streamer & multi-threaded chunked downloader"
keywords = ["anime", "cli", "arabic", "mpv", "streaming"]
categories = ["command-line-utilities", "multimedia::video"]

[[bin]]
name = "senku-anime-cli"
path = "src/main.rs"

[[bin]]
name = "sac"
path = "src/bin/sac.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6.0"
futures = "0.3"
indicatif = "0.17"
owo-colors = { version = "4.1", features = ["supports-colors"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate", "stream", "cookies"] }
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
toml = "0.8"
url = "2.5"
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
